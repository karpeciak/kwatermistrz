# Konfiguracja migracji bazy danych (Alembic).
# Adres bazy pochodzi ze zmiennej DATABASE_URL (patrz src/kwatermistrz/config.py), nie z tego pliku.
#
# Nowa migracja po zmianie w models.py:
#   alembic revision --autogenerate -m "opis zmiany"
# Zastosowanie migracji lokalnie:
#   alembic upgrade head
# W Azure migracje uruchamia API przy starcie.

[alembic]
script_location = src/kwatermistrz/migracje
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
