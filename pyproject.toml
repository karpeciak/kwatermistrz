[project]
name = "kwatermistrz"
version = "0.1.0"
description = "Kwatermistrz – wieloagentowy system obsługi wyjazdów służbowych w wojsku"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "aio-pika>=9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwatermistrz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Header w domyślnych argumentach to standardowy wzorzec FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
